[package]
name = "vmctl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Contracts are exercised by integration tests; these targets have no unit tests.
[[bin]]
name = "vmctl"
path = "src/main.rs"
test = false

[dependencies]
clankerd-proto.workspace = true
clap = { version = "4.6.7", features = ["derive", "env", "string"] }
libc = "0.2.190"
libclankerd.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

schemars = { version = "1", features = ["derive"] }

[dev-dependencies]
flate2 = "1.1.9"
sha2 = "0.11.0"
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"
