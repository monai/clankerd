name: clankerd

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clankerd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - run: make vet

      - run: make test

      - run: make build

      - name: Package
        run: |
          mkdir -p dist
          for t in build/*/; do
            t=$(basename "$t")
            tar -C "build/$t" -czf "dist/clankerd-$t.tar.gz" clankerd clankerctl
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: clankerd
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: clankerd
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
