name: clankerd

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clankerd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - run: make vet

      - run: make test

      - run: make build

      - name: Package
        run: |
          mkdir -p dist
          for t in build/*/; do
            t=$(basename "$t")
            files="clankerd hostctl"
            if [ "$t" = linux-arm64 ]; then files="$files guestctl"; fi
            tar -C "build/$t" -czf "dist/clankerd-$t.tar.gz" $files
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)

      - uses: actions/upload-artifact@v7
        with:
          name: clankerd
          path: dist/*

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the pinned rust, zig, cargo-zigbuild and rcodesign from mise.toml
      - uses: jdx/mise-action@v3
        with:
          cache: true

      - uses: Swatinem/rust-cache@v2

      - run: mise exec -- make rust-lint

      - run: mise exec -- make rust-test

      # Cross-links the darwin binaries, builds the static musl guest binary,
      # signs clankerd-vmspawn and verifies the entitlement.
      - run: mise exec -- make rust

      - uses: actions/upload-artifact@v7
        with:
          name: clankerd-rust
          path: build/rust/**

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: clankerd
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
