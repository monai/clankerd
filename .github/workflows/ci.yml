name: clankerd

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clankerd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the pinned rust, zig, cargo-zigbuild and rcodesign from mise.toml
      - uses: jdx/mise-action@v3
        with:
          cache: true

      - uses: Swatinem/rust-cache@v2

      - run: mise exec -- make lint

      - run: mise exec -- make test

      # Seam B as root: chown to foreign owners, mknod, security.capability and
      # the loop-mount population of an ext4 root disk cannot run unprivileged
      # (those tests skip themselves in the step above and print SKIPPED).
      # The image tests also pull debian:trixie-slim and ghcr.io/monai/clankers:slim.
      # The step fails if anything skipped, so a silently unprivileged run cannot pass.
      - name: Seam B (root, real images)
        env:
          CLANKERD_TEST_NETWORK: "1"
        run: |
          sudo apt-get install -y --no-install-recommends e2fsprogs
          sudo -E env "PATH=$PATH" "HOME=$HOME" mise exec -- cargo test -p clankerd-guestd --test seam_b -- --nocapture 2>&1 | tee seam-b.log
          sudo -E env "PATH=$PATH" "HOME=$HOME" mise exec -- cargo test -p clankerd-guestd --bin clankerd-guestd volume -- --nocapture 2>&1 | tee -a seam-b.log
          sudo -E env "PATH=$PATH" "HOME=$HOME" mise exec -- cargo test -p libclankerd --test images --test seam_b_images -- --nocapture 2>&1 | tee -a seam-b.log
          if grep -q '^SKIPPED' seam-b.log; then echo "seam B tests were skipped:"; grep '^SKIPPED' seam-b.log; exit 1; fi

      - name: Rust coverage (lines and branches)
        run: mise exec -- make coverage-setup coverage

      - uses: actions/upload-artifact@v7
        with:
          name: clankerd-rust-coverage
          path: build/coverage/**

      # Cross-links the darwin binaries, builds the static musl guest binary,
      # signs clankerd-vmspawn and verifies the entitlement.
      - run: mise exec -- make build

      - uses: actions/upload-artifact@v7
        with:
          name: clankerd-rust
          path: build/rust/**

      - name: Package
        run: |
          mkdir -p dist
          for target in darwin-arm64 linux-arm64; do
            tar -C "build/rust/$target" -czf "dist/clankerd-$target.tar.gz" .
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)

      - uses: actions/upload-artifact@v7
        with:
          name: clankerd
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: clankerd
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
